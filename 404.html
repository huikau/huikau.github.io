<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost at sea · Huikau</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E2B30">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/site.js" defer></script>
</head>
<body>
  <main>
    <section class="scene" aria-label="Open water">
      <div class="stars" id="stars" aria-hidden="true"></div>
      <svg class="moon" id="moon" viewBox="0 0 54 54" aria-hidden="true">
        <circle class="moon-dark" cx="27" cy="27" r="24"/>
        <path class="moon-lit" id="moon-lit" d="M27 3 A24 24 0 1 1 27 51 A24 24 0 1 1 27 3 Z"/>
      </svg>
      <div class="clouds" id="clouds" aria-hidden="true"></div>

      <div class="lost">
        <h1>Lost at sea.</h1>
        <p>This page drifted off somewhere. Ula's still fishing back at the main dock.</p>
        <a class="home-btn" href="/">Paddle back home</a>
      </div>

      <div class="sea" aria-hidden="true">
        <span class="greenflash" id="greenflash"></span>
        <div class="whale" id="whale">
          <span class="spout"></span>
          <svg class="fluke" viewBox="0 0 60 40"><path d="M28 40 C28 31 28.5 25 29 21 C23 13 12 8 2 9 C9 12 17 16 22 21 C25 23 27.5 21 30 18 C32.5 21 35 23 38 21 C43 16 51 12 58 9 C48 8 37 13 31 21 C31.5 25 32 31 32 40 Z"/></svg>
        </div>
        <svg class="wave back" viewBox="0 0 2880 200" preserveAspectRatio="none">
          <path fill="currentColor" d="M0 44 C120 14 240 14 360 44 S600 74 720 44 S960 14 1080 44 S1320 74 1440 44 S1680 14 1800 44 S2040 74 2160 44 S2400 14 2520 44 S2760 74 2880 44 V200 H0 Z"/>
        </svg>
        <svg class="wave mid" viewBox="0 0 2880 200" preserveAspectRatio="none">
          <path fill="currentColor" d="M0 40 C80 18 160 18 240 40 S400 62 480 40 S640 18 720 40 S880 62 960 40 S1120 18 1200 40 S1360 62 1440 40 S1600 18 1680 40 S1840 62 1920 40 S2080 18 2160 40 S2320 62 2400 40 S2560 18 2640 40 S2800 62 2880 40 V200 H0 Z"/>
        </svg>
        <svg class="wave front" viewBox="0 0 2880 200" preserveAspectRatio="none">
          <path fill="currentColor" d="M0 26 C60 10 120 10 180 26 S300 42 360 26 S480 10 540 26 S660 42 720 26 S840 10 900 26 S1020 42 1080 26 S1200 10 1260 26 S1380 42 1440 26 S1560 10 1620 26 S1740 42 1800 26 S1920 10 1980 26 S2100 42 2160 26 S2280 10 2340 26 S2460 42 2520 26 S2640 10 2700 26 S2820 42 2880 26 V200 H0 Z"/>
        </svg>
      </div>

      <div class="showers" id="showers" aria-hidden="true" hidden></div>

      <div class="adrift">
        <img class="ula" src="/assets/ula.webp" width="96" height="96" alt="Ula, drifting on the waves">
      </div>
    </section>
  </main>
</body>
</html>
